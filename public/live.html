<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QFwork.ai — Live Interview (Phase 1 test)</title>
<style>
  :root { --teal:#0f766e; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --bg:#f8fafc; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background:var(--bg); color:var(--ink); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--mut); font-size: 14px; margin: 0 0 24px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 20px; cursor:pointer; }
  #connect { background:var(--teal); color:#fff; }
  #end { background:#ef4444; color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .status { font-size:13px; color:var(--mut); margin-left:auto; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#cbd5e1; margin-right:6px; vertical-align:middle; }
  .dot.live { background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.18); }
  .captions { margin-top:20px; display:flex; flex-direction:column; gap:10px; max-height:380px; overflow:auto; }
  .msg { padding:10px 14px; border-radius:12px; font-size:15px; line-height:1.45; max-width:85%; }
  .msg.you { align-self:flex-end; background:#0f766e; color:#fff; border-bottom-right-radius:4px; }
  .msg.ai  { align-self:flex-start; background:#f1f5f9; color:var(--ink); border-bottom-left-radius:4px; }
  .who { display:block; font-size:11px; opacity:.7; margin-bottom:2px; }
  .log { margin-top:18px; font:12px/1.5 ui-monospace, Menlo, monospace; color:var(--mut);
         background:#0f172a08; border-radius:10px; padding:10px 12px; max-height:140px; overflow:auto; white-space:pre-wrap; }
  .hint { font-size:13px; color:var(--mut); margin-top:14px; }
  .hint b { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <h1>QFwork.ai — Live AI Interview</h1>
  <p class="sub">Phase 1 connectivity test · OpenAI Realtime (server-relayed)</p>

  <div class="panel">
    <div class="row">
      <button id="connect">Start interview</button>
      <button id="end" disabled>End</button>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">Idle</span></span>
    </div>

    <div class="captions" id="captions"></div>

    <div class="log" id="log"></div>

    <p class="hint">🎧 <b>Use headphones</b> for this test — without them the AI's voice leaks into your mic and triggers false interruptions.
       The AI greets you first, then asks follow-up questions. Just talk back naturally.</p>
  </div>
</div>

<script>
// ============================================================
// Live interview client — OpenAI Realtime over the /realtime relay
// ============================================================
const $ = (id) => document.getElementById(id);
const logEl = $('log'), capEl = $('captions');

function log(...a){ logEl.textContent += a.join(' ') + '\n'; logEl.scrollTop = logEl.scrollHeight; }
function setStatus(t, live){ $('statusText').textContent = t; $('dot').classList.toggle('live', !!live); }

// ---- caption rendering -------------------------------------------------
let aiBubble = null;
function addYou(text){
  const d = document.createElement('div'); d.className = 'msg you';
  d.innerHTML = '<span class="who">You</span>' + escapeHtml(text);
  capEl.appendChild(d); capEl.scrollTop = capEl.scrollHeight; aiBubble = null;
}
function aiDelta(text){
  if (!aiBubble){
    aiBubble = document.createElement('div'); aiBubble.className = 'msg ai';
    aiBubble.innerHTML = '<span class="who">AI interviewer</span><span class="body"></span>';
    capEl.appendChild(aiBubble);
  }
  aiBubble.querySelector('.body').textContent += text;
  capEl.scrollTop = capEl.scrollHeight;
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- audio helpers -----------------------------------------------------
function floatToPCM16(float32){
  const out = new Int16Array(float32.length);
  for (let i=0;i<float32.length;i++){
    let s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return out;
}
function bytesToBase64(bytes){
  let bin = ''; const chunk = 0x8000;
  for (let i=0;i<bytes.length;i+=chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return btoa(bin);
}
function base64ToInt16(b64){
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Int16Array(bytes.buffer);
}

// ---- playback queue (gapless scheduling) -------------------------------
let playCtx = null, nextTime = 0, scheduled = [];
function enqueueAudio(int16){
  if (!playCtx) playCtx = new AudioContext({ sampleRate: 24000 });
  const f32 = new Float32Array(int16.length);
  for (let i=0;i<int16.length;i++) f32[i] = int16[i] / 0x8000;
  const buf = playCtx.createBuffer(1, f32.length, 24000);
  buf.copyToChannel(f32, 0);
  const src = playCtx.createBufferSource();
  src.buffer = buf; src.connect(playCtx.destination);
  const now = playCtx.currentTime;
  if (nextTime < now) nextTime = now + 0.02;
  src.start(nextTime); nextTime += buf.duration;
  scheduled.push(src);
  src.onended = () => { scheduled = scheduled.filter(s => s !== src); };
}
function stopPlayback(){ scheduled.forEach(s => { try { s.stop(); } catch(e){} }); scheduled = []; nextTime = 0; }

// ---- the interviewer persona (Phase 1 generic; Phase 2 = per scenario) -
const INSTRUCTIONS = `You are a friendly but professional job interviewer running a mock interview to help the candidate practise workplace English. Greet the candidate warmly in one sentence, then ask interview questions ONE at a time and ask natural follow-up questions based on their answers. Keep each of your turns short — 1 to 3 sentences. Speak conversationally. Do NOT give feedback or scores during the interview; just conduct it.`;

// ---- session lifecycle -------------------------------------------------
let ws = null, audioCtx = null, micStream = null, workletNode = null;

async function start(){
  $('connect').disabled = true;
  setStatus('Connecting…');
  log('Opening relay WebSocket…');

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/realtime`);

  ws.onopen  = () => log('Relay socket open. Waiting for OpenAI…');
  ws.onerror = () => { log('WebSocket error.'); setStatus('Error'); };
  ws.onclose = () => { log('Relay socket closed.'); cleanup(); };
  ws.onmessage = (e) => handleServerEvent(JSON.parse(e.data));
}

function send(obj){ if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

async function handleServerEvent(ev){
  switch (ev.type) {
    case 'relay.ready':
      log('OpenAI connected via relay (model: ' + ev.model + '). Configuring session…');
      send({
        type: 'session.update',
        session: {
          type: 'realtime',
          output_modalities: ['audio'],
          audio: {
            input:  {
              format: { type: 'audio/pcm', rate: 24000 },
              turn_detection: { type: 'semantic_vad' },
              transcription: { model: 'whisper-1' }
            },
            output: { format: { type: 'audio/pcm', rate: 24000 }, voice: 'marin' }
          },
          instructions: INSTRUCTIONS
        }
      });
      break;

    case 'session.updated':
      log('Session ready. Starting microphone…');
      await startMic();
      setStatus('Live — listening', true);
      $('end').disabled = false;
      // Make the AI open the interview.
      send({ type: 'response.create' });
      break;

    case 'input_audio_buffer.speech_started':
      // Barge-in: user started talking → stop the AI's current audio.
      stopPlayback();
      break;

    case 'response.output_audio.delta':
      if (ev.delta) enqueueAudio(base64ToInt16(ev.delta));
      break;

    case 'response.output_audio_transcript.delta':
      if (ev.delta) aiDelta(ev.delta);
      break;

    case 'conversation.item.input_audio_transcription.completed':
      if (ev.transcript) addYou(ev.transcript.trim());
      break;

    case 'relay.error':
    case 'error':
      log('⚠️  ' + (ev.message || (ev.error && ev.error.message) || JSON.stringify(ev)));
      setStatus('Error');
      break;

    case 'relay.upstream_closed':
      log('OpenAI closed the connection (code ' + ev.code + '). ' + (ev.reason||''));
      break;
  }
}

async function startMic(){
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  audioCtx = new AudioContext({ sampleRate: 24000 });
  await audioCtx.audioWorklet.addModule('pcm-worklet.js');
  const source = audioCtx.createMediaStreamSource(micStream);
  workletNode = new AudioWorkletNode(audioCtx, 'pcm-capture');
  workletNode.port.onmessage = (e) => {
    const pcm16 = floatToPCM16(e.data);
    send({ type: 'input_audio_buffer.append', audio: bytesToBase64(new Uint8Array(pcm16.buffer)) });
  };
  source.connect(workletNode);
  // Keep the graph pulling without echoing the mic to the speakers.
  const sink = audioCtx.createGain(); sink.gain.value = 0;
  workletNode.connect(sink); sink.connect(audioCtx.destination);
}

function end(){ log('Ending session.'); if (ws) ws.close(); cleanup(); }

function cleanup(){
  stopPlayback();
  if (workletNode) { try { workletNode.disconnect(); } catch(e){} workletNode = null; }
  if (micStream)  { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx)   { audioCtx.close().catch(()=>{}); audioCtx = null; }
  $('connect').disabled = false; $('end').disabled = true;
  setStatus('Idle', false);
}

$('connect').addEventListener('click', start);
$('end').addEventListener('click', end);
</script>
</body>
</html>
